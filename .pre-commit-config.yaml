# Local secret-scanning gate — blocks a commit that contains a key/token before
# it ever reaches git (the .env leak this repo already had must never recur).
#
# One-time setup on each dev machine:
#   pip install pre-commit
#   pre-commit install
#
# It then runs automatically on every `git commit`. CI runs gitleaks too (see
# .github/workflows/ci.yml) as the server-side backstop.
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.18.4
    hooks:
      - id: gitleaks

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-added-large-files      # stop stray media/binaries (e.g. uploads/) sneaking in
        args: [--maxkb=2048]
      - id: detect-private-key
      - id: end-of-file-fixer
      - id: trailing-whitespace
