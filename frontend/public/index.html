        <!-- Brand-level Open Graph / Twitter defaults so link shares (WhatsApp,
             Facebook, Twitter, LinkedIn, Telegram) render a preview card instead
             of a bare URL. Public invitation + portfolio routes are re-rendered
             server-side for crawlers with their own per-page og:* (see Caddy
             @crawler -> server.py _render_og_*), which override these. Absolute
             URLs are required — crawlers reject relative og:image / og:url.
             NOTE: /og-image.jpg (1200x630, <1MB, logo + one-line value prop) is
             the recommended upgrade; using logo512.png as an interim so the card
             is never empty. Per-route <link rel=canonical> is set in-app, not
             here (a static shell canonical would point every route at the home
             page). -->
        <meta property="og:type" content="website" />
        <meta property="og:site_name" content="MAJA Invites" />
        <meta property="og:locale" content="en_IN" />
        <meta property="og:url" content="https://majainvites.com/" />
        <meta property="og:title" content="MAJA Invites — Cinematic AI Wedding Invitations" />
        <meta property="og:description" content="Premium digital wedding invitations, live photo walls, and AI storytelling for Indian wedding photographers." />
        <meta property="og:image" content="https://majainvites.com/logo512.png" />
        <meta property="og:image:width" content="512" />
        <meta property="og:image:height" content="512" />
        <meta name="twitter:card" content="summary_large_image" />
        <meta name="twitter:title" content="MAJA Invites — Cinematic AI Wedding Invitations" />
        <meta name="twitter:description" content="Premium digital wedding invitations for Indian wedding photographers." />
        <meta name="twitter:image" content="https://majainvites.com/logo512.png" />

        <!-- Brand entity + site JSON-LD (Organization / WebSite) so Google can
             build the branded knowledge panel — important while marketplaces

        <script type="application/ld+json">
        {
          "@context": "https://schema.org",
          "@graph": [
            {
              "@type": "Organization",
              "@id": "https://majainvites.com/#organization",
              "name": "MAJA Invites",
              "url": "https://majainvites.com",
              "logo": "https://majainvites.com/logo512.png",
              "description": "AI-powered wedding experience platform for premium Indian wedding photographers.",
              "sameAs": []

            {
              "@type": "WebSite",
              "@id": "https://majainvites.com/#website",
              "url": "https://majainvites.com",
              "name": "MAJA Invites",
              "publisher": { "@id": "https://majainvites.com/#organization" }
            }

        </script>

        <!-- ============================================================
             Blank-page-on-refresh recovery.

             After a redeploy the JS bundle filenames change and the old ones are
             deleted. If a browser (or a CDN) hands out a stale index.html that
             still points at a deleted /static/js chunk, that chunk 404s, React
             NEVER boots, and the page is a black void (the app's dark body shows
             through an empty #root). The in-app React ErrorBoundary cannot help
             here — it only exists once React has mounted.

             This runs BEFORE React, catches a failed app chunk / stylesheet, and
             force-reloads ONCE (bypassing cache) to pull the current index.html.
             It is hard rate-limited so it can never loop into the very black
             screen it is trying to prevent — if a single recovery reload doesn't
             fix it, it paints a readable "Reload" card instead of a black page.
             ============================================================ -->
        <script>
        (function () {
          var KEY = 'maja_boot_reload_at';
          var WINDOW_MS = 20000; // at most one auto-reload per 20s → no loop
          function recently() {
            try { return Date.now() - (parseInt(sessionStorage.getItem(KEY), 10) || 0) < WINDOW_MS; }
            catch (e) { return false; }
          }
          function stuckCard() {
            var r = document.getElementById('root');
            if (!r || r.getAttribute('data-booted') === '1' || (r.firstChild && r.firstChild.id !== 'boot-splash')) return;
            r.innerHTML =
              '<div style="min-height:100vh;display:grid;place-items:center;background:#12100c;color:#e8d5a3;font-family:system-ui,sans-serif;text-align:center;padding:24px">'
              + '<div><div style="font-size:18px;margin-bottom:8px">Couldn’t finish loading</div>'
              + '<div style="font-size:13px;opacity:.75;margin-bottom:18px;max-width:320px">A new version may have just been released. Reloading usually fixes it.</div>'
              + '<button id="maja-reload-btn" style="background:#d4af37;color:#16110c;border:0;border-radius:8px;padding:11px 22px;font-size:14px;font-weight:600;cursor:pointer">Reload</button></div></div>';
            var b = document.getElementById('maja-reload-btn');
            if (b) b.onclick = function () { try { sessionStorage.removeItem(KEY); } catch (e) {} window.location.reload(); };
          }
          function recover() {
            if (recently()) { stuckCard(); return; }
            try { sessionStorage.setItem(KEY, String(Date.now())); } catch (e) {}
            var u;
            try { u = new URL(window.location.href); u.searchParams.set('_v', String(Date.now())); }
            catch (e) { window.location.reload(); return; }
            window.location.replace(u.toString());
          }
          // A <script>/<link> that fails to load fires 'error' at the window in
          // the CAPTURE phase (it does not bubble). Only recover for OUR build
          // assets, never for a third-party script (analytics, fonts, …).
          window.addEventListener('error', function (e) {
            var t = e && e.target; if (!t) return;
            var url = t.src || t.href || '';
            if ((t.tagName === 'SCRIPT' || t.tagName === 'LINK') && /\/static\/(js|css)\//.test(url)) recover();
          }, true);
          // A failed dynamic import surfaces as an unhandled ChunkLoadError.
          window.addEventListener('unhandledrejection', function (e) {
            var m = (e && e.reason && ((e.reason.name || '') + ' ' + (e.reason.message || ''))) || '';
            if (/ChunkLoadError|Loading chunk|Loading CSS chunk|dynamically imported module/i.test(m)) recover();
          });
          // Last resort: if #root is STILL empty a while after load, React never
          // mounted at all — recover once, else show the card (never stay black).
          window.addEventListener('load', function () {
            setTimeout(function () {
              var r = document.getElementById('root');
              var empty = r && r.getAttribute('data-booted') !== '1' &&
                          (!r.firstChild || r.firstChild.id === 'boot-splash');
              if (empty) { if (!recently()) recover(); else stuckCard(); }
            }, 9000);
          });
        })();
        </script>
    </head>
