[pytest]
# backend/tests/conftest.py has always CLAIMED auto-mode in a comment:
#
#     # Use auto-mode so @pytest.mark.asyncio works without a per-test
#     # event_loop fixture.
#
# ...but nothing ever set it, and the repo had no pytest config file at all.
# The result was silent and expensive: every async test failed with
# "async def functions are not natively supported" rather than running, so a
# full-suite run reported ~94 failures that were entirely an artifact of the
# missing setting. Setting it here took that run to 100 passed / 37 failed.
#
# pytest-asyncio and pytest-timeout are now pinned in backend/requirements.txt
# too — conftest.py imports pytest_asyncio at module scope, so without it
# collection dies before a single test runs.
asyncio_mode = auto

# The suite is an INTEGRATION suite: it talks to a real server over HTTP at
# REACT_APP_BACKEND_URL (default http://localhost:8001). With no stack running
# every test errors on connection-refused, which tells you nothing about the
# code. Bring the stack up first — see SESSION_CONTEXT.md "Running locally".
#
# A hung request should fail that one test, not wedge the whole run.
timeout = 180
